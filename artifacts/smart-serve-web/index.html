<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf2f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="SmartServe - AI-powered local services marketplace. Describe your problem, get an instant estimate, and track verified providers live." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>SmartServe — Your Local Service. Smarter.</title>
    <script>
      // apply saved theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem("ss-theme");
          var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          var bw = localStorage.getItem("ss-bandwidth") === "low";
          if (bw) document.documentElement.setAttribute("data-bandwidth", "low");
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.setAttribute("data-motion", "reduced");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
